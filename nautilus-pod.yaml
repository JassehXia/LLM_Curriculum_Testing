apiVersion: v1
kind: Pod
metadata:
  name: curriculum-vllm-sandbox
  labels:
    app: curriculum-vllm-sandbox
spec:
  runtimeClassName: nvidia
  containers:
  - name: vllm-container
    image: vllm/vllm-openai:latest
    args:
      - "--model=Qwen/Qwen2.5-Coder-32B-Instruct-AWQ"
      - "--quantization=awq"
      - "--port=8000"
      - "--max-model-len=32768"
      - "--gpu-memory-utilization=0.90"
    ports:
      - containerPort: 8000
        name: http
    resources:
      limits:
        cpu: "8"
        memory: "32Gi"
        nvidia.com/gpu: "1"
      requests:
        cpu: "4"
        memory: "16Gi"
        nvidia.com/gpu: "1"
    volumeMounts:
      - mountPath: /dev/shm
        name: dshm
      - mountPath: /root/.cache
        name: hf-cache
  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
    - name: hf-cache
      emptyDir: {}
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: nvidia.com/gpu.product
                operator: In
                values:
                  - NVIDIA-A100-SXM4-80GB
                  - NVIDIA-A100-80GB-PCIe
                  - NVIDIA-RTX-A6000
                  - NVIDIA-L40S
                  - NVIDIA-L40
                  - NVIDIA-A40
                  - NVIDIA-A10
                  - NVIDIA-GeForce-RTX-3090
                  - NVIDIA-RTX-A5000
  restartPolicy: Never
